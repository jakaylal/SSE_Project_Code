<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/upload.css">
    <script src="js/uploadPage.js" defer></script>
    <title>Upload Patient Data - Pneumonia Detection</title>
</head>
<body>
    <header>
        <nav>
            <h1>Pneumonia Detection</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="patientInformation.html">Patient Information</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="performance.html">Performance Measures</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Patient Data Upload</h2>
            <p>Submit patient information and medical imaging for pneumonia analysis</p>
        </div>
    </section>

    <div class="container">
        <div class="form-section">
            <form id="uploadForm" method="POST" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-group">
                        <label for="patientName">Patient Name*</label>
                        <input type="text" id="patientName" name="patientName" required>
                    </div>
                    <div class="form-group">
                        <label for="dateOfBirth">Date of Birth*</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age*</label>
                        <input type="number" id="age" name="age" step="1" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender*</label>
                        <select  type="options" id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">Weight (kg)*</label>
                        <input type="number" id="weight" name="weight" step="1.0" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="height">Height (cm)*</label>
                        <input type="number" id="height" name="height" step="1.0" min="0" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number*</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address*</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="image">Medical Image (X-ray)*</label>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📷</div>
                        <div class="hint">Drag & drop an X-ray image here, or click to choose</div>
                        <input type="file" id="image" name="image" accept="image/*" required style="display:none">
                        <img id="previewImg" class="preview-thumb" src="" alt="Preview" style="display:none">
                    </div>
                </div>

                <div class="form-group">
                    <div class="analyze-row">
                        <div class="result-badge" id="resultBadge">No image selected</div>
                        <div class="spinner" id="spinner"></div>
                        <button type="button" class="btn" id="analyzeBtn" disabled>Upload and Analyze</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ColorVision </p>
    </footer>
</body>
</html>
