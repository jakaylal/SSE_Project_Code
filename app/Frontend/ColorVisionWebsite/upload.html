<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/upload.css">
    <script src="js/uploadPage.js" defer></script>
    <script src="js/navBar.js" defer></script>
    <title>Upload Patient Data - Pneumonia Detection</title>
</head>
<body>
    <header>
        <nav>
            <h1>Pneumonia Detection</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li id="authStatus"><a href="loginCredentials.html">Sign In</a></li>
                <!--the 2 below should only show if the user is signed in to an account-->
                <!--the top bar is inconsistent throughout other pages as well-->
                <li class = "authOnly" ><a href="upload.html">Upload Image</a></li>
                <li class = "authOnly"><a href="results.html">Results</a></li>
                <li class = "authOnly"><a href="patientInformation.html">Info</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Patient Data Upload</h2>
            <p>Submit patient information and medical imaging for pneumonia analysis</p>
        </div>
    </section>

    <div class="container">
        <div class="form-section">
            <form id="uploadForm" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="image">Medical Image (X-ray)*</label>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📷</div>
                        <div class="hint">Drag & drop an X-ray image here, or click to choose</div>
                        <input type="file" id="image" name="image" accept="image/*" required style="display:none">
                        <img id="previewImg" class="preview-thumb" src="" alt="Preview" style="display:none">
                    </div>
                </div>

                <div class="form-group">
                    <div class="analyze-row">
                        <div class="result-badge" id="resultBadge">No image selected</div>
                        <div class="spinner" id="spinner"></div>
                        <button type="button" class="btn" id="analyzeBtn" disabled>Upload and Analyze</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ColorVision </p>
    </footer>
</body>
</html>
