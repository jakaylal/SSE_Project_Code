<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/signupStyles.css">
    <script src="js/signupCredentials.js" defer></script>
    <script src="js/navBar.js" defer></script>
    <title>Sign Up - Pneumonia Detection</title>
</head>
<body>
    <header>
        <nav>
            <h1>Pneumonia Detection</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li id="authStatus"><a href="loginCredentials.html">Sign In</a></li>
                <!--the 2 below should only show if the user is signed in to an account-->
                <!--the top bar is inconsistent throughout other pages as well-->
                <li class = "authOnly" ><a href="upload.html">Upload Image</a></li>
                <li class = "authOnly"><a href="results.html">Results</a></li>
                <li class = "authOnly"><a href="patientInformation.html">Info</a></li>
            </ul>
        </nav>
    </header>

    <section class="signup-section">
        <div class="signup-content">
            <h2>Sign Up</h2>
            <p>Please enter your details to create an account</p>
            <form id="form" action="#">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input required type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input required type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input required type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input required type="text" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input required type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input required type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>

            <div id="submitStatus"></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 ColorVision </p>
    </footer>
</body>
</html>
