<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/results.css">
    <script src="js/navBar.js" defer></script>
    <script src="js/results.js" defer></script>
    <title>Pneumonia Detection Results</title>
</head>
<body>
    <header>
        <nav>
            <h1>Pneumonia Detection</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li id="authStatus"><a href="loginCredentials.html">Sign In</a></li>
                <!--the 2 below should only show if the user is signed in to an account-->
                <!--the top bar is inconsistent throughout other pages as well-->
                <li class = "authOnly" ><a href="upload.html">Upload Image</a></li>
                <li class = "authOnly"><a href="results.html">Results</a></li>
                <li class = "authOnly"><a href="patientInformation.html">Info</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        
        <p class="subtitle">Analysis Complete</p>

        <div class="patient-info">
            <div class="info-row">
                <div class="info-item">
                    <span class="info-label">Upload Date</span>
                    <span class="info-value" id="uploadDate">-</span>
                </div>
            </div>
        </div>

        <div class="results-section">
            <h2 class="results-title">Image Analysis</h2>
            <div class="image-comparison">
                <div class="image-container">
                    <div class="image-label">Original Image</div>
                    <div class="image-wrapper">
                        <img id="originalImage" src="" alt="Original X-ray Image">
                    </div>
                </div>
                <div class="image-container">
                    <div class="image-label">Analysis Visualization</div>
                    <div class="image-wrapper">
                        <img id="analysisImage" src="" alt="Analysis Visualization">
                    </div>
                </div>
            </div>

            <div class="prediction-result">
                <div class="prediction-label">Prediction Result</div>
                <div class="prediction-value" id="predictionResult">-</div>
                <div class="confidence">
                    Confidence Score: <span id="confidenceScore">0</span>%
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-secondary" onclick="window.history.back()">Back</button>
            <button class="btn-primary" onclick="window.location.href='upload.html'">New Analysis</button>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 ColorVision </p>
    </footer>
</body>
</html>
